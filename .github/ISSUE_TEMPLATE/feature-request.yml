name: Feature request
description: Propose new functionality or an enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is painful or impossible today? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should happen instead? Rough is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else would solve this, and why is it worse?
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: The filer's read, not the verdict — the maintainer re-triages on the board. State it anyway so triage starts from a position.
      options:
        - Urgent — blocks the release
        - High — lands on the current branch
        - Medium — follow-up
        - Low — parked
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Small — fits in one PR
        - Medium — a few PRs, no design doc
        - Large — needs a design doc first
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What closes this
      description: "Name a rung on the evidence ladder — specified / unit-tested / persisted / wired / real-provider-proven / journey-accepted / beta-ready (repo-standards §6.6) — and the artifact that proves it. Closing at journey-accepted or above requires that artifact attached as a comment."
      placeholder: |
        Rung: wired
        Artifact: the new setting round-trips through the UI and survives a reload
    validations:
      required: true
