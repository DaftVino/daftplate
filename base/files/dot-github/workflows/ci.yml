name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          node-version: '20'
      - name: Test
        run: |
          if [ -f package.json ]; then
            npm test --if-present
          else
            echo "No package.json yet — nothing to test."
          fi

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Bumping GITLEAKS_VERSION REQUIRES bumping GITLEAKS_SHA256 in the same
      # commit. Take the new digest from the release's checksums file —
      # gitleaks_<version>_checksums.txt, the *_linux_x64.tar.gz line — and put
      # the literal here. Never fetch that file at runtime: pulling it from the
      # same release, over the same channel, at the same moment as the tarball
      # verifies nothing, because whoever can alter the tarball can alter the
      # checksums beside it. A mismatch fails this job loudly and on purpose —
      # an unexpected digest means the bytes are not the bytes that were reviewed.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0   # full history — gitleaks git scans commits, not the worktree
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf --retry 3 -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan history for secrets
        run: ./gitleaks git . --redact --no-banner
